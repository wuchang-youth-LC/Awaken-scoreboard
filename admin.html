<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 關主｜2026 Awaken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <header class="page-head">
            <span class="brand">D2</span>
            <h1 id="stationTitle">載入中…</h1>
            <div class="head-right"><span class="hint" id="whoami"></span><button class="btn btn-ghost" id="logoutBtn">登出</button></div>
        </header>

        <button id="statusBtn" class="status-toggle"></button>

        <div class="panel">
            <div class="field">
                <label class="label" for="teamSelect">隊伍</label>
                <select id="teamSelect"></select>
            </div>

            <div class="field" id="timeGroup">
                <label class="label">花費時間</label>
                <div class="time-row">
                    <input type="number" id="minInput" inputmode="numeric" placeholder="0" min="0"><span>分</span>
                    <input type="number" id="secInput" inputmode="numeric" placeholder="0" min="0" max="59"><span>秒</span>
                </div>
                <p class="hint" id="timeHint"></p>
            </div>

            <div class="field" id="scoreGroup" hidden>
                <label class="label" for="scoreInput" id="scoreLabel">獲得數值</label>
                <input type="number" id="scoreInput" inputmode="numeric" placeholder="0" min="0">
                <p class="hint" id="scoreHint"></p>
            </div>

            <div class="field">
                <label class="label">給這隊的讚</label>
                <div class="stepper">
                    <button id="likeMinus" aria-label="減少讚">−</button>
                    <span class="count"><span class="num" id="likeCount">0</span> / <span id="likeMax">3</span></span>
                    <button id="likePlus" aria-label="增加讚">+</button>
                </div>
            </div>

            <button id="submitBtn" class="btn btn-primary btn-block">送出成績</button>
        </div>

        <h2 class="section-title">本關紀錄</h2>
        <div class="panel"><ul class="record-list" id="records"></ul></div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
