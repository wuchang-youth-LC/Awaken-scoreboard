<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大地遊戲｜Awaken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="display light">
    <div class="student">
        <header class="page-head">
            <img class="logo" src="assets/logo-awaken.png" alt="AWAKEN">
            <div class="lockup">
                <span class="lockup-big" id="gameBig"></span>
                <div class="lockup-text"><h1>大地遊戲</h1><span class="lockup-sub" data-camp-title></span></div>
            </div>
        </header>

        <!-- 每個區塊要不要顯示，在總控台「設定」裡開關 -->
        <section id="block-map" hidden>
            <h2 class="section-title">地圖</h2>
            <img class="map-img" id="mapImg" alt="營地地圖">
        </section>

        <section id="block-stations" hidden>
            <h2 class="section-title">關卡狀態</h2>
            <div class="st-tiles" id="stations"></div>
        </section>

        <section id="block-scores" hidden>
            <h2 class="section-title">各隊大地得分</h2>
            <div class="likes-grid" id="scores"></div>
        </section>

        <p class="empty" id="nothing" hidden>目前沒有開放的內容。</p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
