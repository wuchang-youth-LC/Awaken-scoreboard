<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 關主｜2026 Awaken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <header class="page-head">
            <span class="brand">D3</span>
            <h1 id="stationTitle">載入中…</h1>
        </header>

        <button id="statusBtn" class="status-toggle"></button>

        <div class="panel">
            <div class="round-ctrl">
                <button class="btn btn-outline" id="prevRound" aria-label="上一輪">‹ 上一輪</button>
                <span class="round">第<span class="num" id="roundNum">1</span>輪</span>
                <button class="btn btn-outline" id="nextRound" aria-label="下一輪">下一輪 ›</button>
            </div>

            <div class="versus">
                <div class="side">
                    <select id="teamA" aria-label="隊伍 A"></select>
                    <div class="stepper">
                        <button id="minusA" aria-label="減少 A 隊的讚">−</button>
                        <span class="count"><span class="num" id="likesA">0</span></span>
                        <button id="plusA" aria-label="增加 A 隊的讚">+</button>
                    </div>
                </div>
                <div class="vs">VS</div>
                <div class="side">
                    <select id="teamB" aria-label="隊伍 B"></select>
                    <div class="stepper">
                        <button id="minusB" aria-label="減少 B 隊的讚">−</button>
                        <span class="count"><span class="num" id="likesB">0</span></span>
                        <button id="plusB" aria-label="增加 B 隊的讚">+</button>
                    </div>
                </div>
            </div>
            <p class="hint" style="text-align:center; margin:-4px 0 14px;">兩隊合計讚數 <b id="likesTotal">0 / 3</b></p>

            <div class="field">
                <label class="label">獲勝隊伍</label>
                <div class="winner-pick">
                    <button id="winA">—</button>
                    <button id="winB">—</button>
                </div>
            </div>

            <button id="submitBtn" class="btn btn-primary btn-block">送出對戰結果</button>
        </div>

        <h2 class="section-title">本關紀錄</h2>
        <div class="panel"><ul class="record-list" id="records"></ul></div>
    </div>

    <script type="module" src="admin_2.js"></script>
</body>
</html>
