<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人員入口｜Awaken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <header class="page-head">
            <img class="logo" src="assets/logo-awaken.png" alt="AWAKEN">
            <div class="lockup">
                <span class="lockup-big" data-camp-year></span>
                <div class="lockup-text"><h1>工作人員入口</h1><span class="lockup-sub" data-camp-title></span></div>
            </div>
        </header>
        <p class="hint" style="margin-bottom:6px;">選你負責的關卡，再輸入你的名字。</p>

        <h2 class="section-title">D2 大地遊戲</h2>
        <div class="entry-grid" id="d2"></div>

        <h2 class="section-title">D3 大地遊戲</h2>
        <div class="entry-grid" id="d3"></div>

        <h2 class="section-title">其他</h2>
        <div class="entry-grid">
            <a class="entry" href="npc.html">場內加分</a>
        </div>
    </div>

    <script type="module">
        import { watchSettings } from "./firebase.js";
        import { gameConfig } from "./games.js";
        import { $, esc } from "./ui.js";

        const links = (game, g) => Object.keys(g.stations).map(Number).map(st =>
            `<a class="entry" href="station.html?game=${game}&station=${st}"><span>第 <span class="num">${st}</span> 關</span>${g.stations[st].name ? `<small>${esc(g.stations[st].name)}</small>` : ""}</a>`).join("");

        watchSettings(s => {
            $("d2").innerHTML = links("d2", gameConfig(s, "d2"));
            $("d3").innerHTML = links("d3", gameConfig(s, "d3"));
        });
    </script>
</body>
</html>
